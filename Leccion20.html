<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>CSS Tables</title>

    <style>
        table {
            width: 60%;
            border-collapse: collapse;
        }

        table, th, td {
            border: 1px solid black;
        }

        th {
            background-color: lightblue;
        }

        th, td {
            padding: 10px;
            text-align: center;
        }

        tr:hover {
            background-color: lightgray;
        }
    </style>
</head>

<body>

    <h1>Tablas en el CSS</h1>

    <table>
        <tr>
            <th>Nombre</th>
            <th>Curso</th>
            <th>Nota</th>
        </tr>

        <tr>
            <td>Kathy</td>
            <td>Desarrollo Web</td>
            <td>80</td>
        </tr>

        <tr>
            <td>Juana</td>
            <td>CSS Y Html</td>
            <td>70</td>
        </tr>
    </table>

</body>
</html>
