<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>CSS Fuentes :D</title>

    <style>
        h1 {
            font-family: Arial, sans-serif;
            color: plum;
        }

        .parrafo1 {
            font-family: "Times New Roman", serif;
            font-size: 20px;
        }

        .parrafo2 {
            font-family: Verdana, sans-serif;
            font-size: 18px;
            font-style: italic;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <h1>Fuentes en CSS</h1>

    <p class="parrafo1">
        Este texto utiliza la fuente Times New Roman que s una de las más usadas en Word.
    </p>

    <p class="parrafo2">
        Este texto utiliza Verdana en negrita y cursiva.
    </p>

</body>
</html>
