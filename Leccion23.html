<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Posicion Css</title>

    <style>
        .static {
            position: static;
            border: 2px solid lightgreen;
            margin-bottom: 20px;
        }

        .relative {
            position: relative;
            left: 30px;
            border: 2px solid royalblue;
        }
    </style>
</head>

<body>

    <h1>Position</h1>

    <div class="static">
        Esta caja tiene posición static.
    </div>

    <div class="relative">
        Esta caja tiene posición relativa.
    </div>

</body>
</html>
