<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>CSS en el Float</title>

    <style>
        img {
            float: left;
            margin-right: 15px;
            width: 150px;
        }
    </style>
</head>

<body>

    <h1>Float</h1>

    <img src="https://www.w3schools.com/css/pineapple.jpg" alt="Piña">

    <p>
        La imagen está alineada a la izquierda utilizando la propiedad del float.
        El texto fluye alrededor de la imagen.
    </p>

</body>
</html>
