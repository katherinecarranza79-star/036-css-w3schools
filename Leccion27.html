<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>CSS Inline-block</title>

    <style>
        .caja {
            display: inline-block;
            width: 150px;
            height: 100px;
            background-color: lightblue;
            border: 2px solid blue;
            margin: 10px;
            text-align: center;
            line-height: 100px;
        }
    </style>
</head>

<body>

    <h1>Inline-block</h1>

    <div class="caja">Caja 1</div>
    <div class="caja">Caja 2</div>
    <div class="caja">Caja 3</div>

</body>
</html>
