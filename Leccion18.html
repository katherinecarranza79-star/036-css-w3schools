<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>CSS  Uso De Los Links</title>

    <style>
        a:link {
            color: blue;
        }

        a:visited {
            color: purple;
        }

        a:hover {
            color: rosybrown;
        }

        a:active {
            color: aquamarine;
        }
    </style>
</head>

<body>

    <h1>Enlaces en CSS</h1>

    <a href="https://www.w3schools.com" target="_blank">
        Visitar  el sitio web W3Schools de dónde hacemos el curso
    </a>

</body>
</html>
