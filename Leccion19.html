<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>CSS Listas</title>

    <style>
        ul {
            list-style-type: square;
        }

        ol {
            list-style-type: upper-roman;
        }
    </style>
</head>

<body>

    <h1>Listas en el CSS</h1>

    <h3>Lista sin ordenar</h3>

    <ul>
        <li>HTML</li>
        <li>CSS</li>
        <li>C++ </C>t</li>
    </ul>

    <h3>Lista ordenada</h3>

    <ol>
        <li>Primero</li>
        <li>Segundo</li>
        <li>Tercero</li>
    </ol>

</body>
</html>
