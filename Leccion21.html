<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Visualización en el CSS</title>

    <style>
        p {
            display: inline;
            background-color: lightblue;
        }

        span {
            display: block;
            background-color: lightsalmon;
            margin-top: 10px;
        }
    </style>
</head>

<body>

    <h1>Display</h1>

    <p>Primer párrafo.</p>
    <p>Segundo párrafo.</p>

    <span>Este "spam" se muestra como un bloque.</span>

</body>
</html>
