<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>CSS en el Overflow</title>

    <style>
        div {
            width: 300px;
            height: 100px;
            border: 2px solid black;
            overflow: auto;
        }
    </style>
</head>

<body>

    <h1>Overflow</h1>

    <div>
     CSS permite controlar cómo se muestra el contenido cuando no cabe dentro de un elemento.
Este ejemplo contiene suficiente texto para que aparezca una barra de desplazamiento y así observar el efecto de la propiedad
 <strong>overflow</strong>. </div>

</body>
</html>
